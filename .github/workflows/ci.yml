# Runs every test on each push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Flutter app (analyze + 60+ tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: SQLite for the database tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.5"   # same as .fvmrc
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  training:
    name: Python pipeline (unit tests + smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Whole pipeline on generated images
        run: python -m tools.smoke_test
